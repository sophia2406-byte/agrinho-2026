<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Paisagem ilustrada de campos cultivados em curvas de nível ao pôr do sol, com um pequeno drone sobrevoando a plantação">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c4"/>
      <stop offset="0.45" stop-color="#f2d9a6"/>
      <stop offset="1" stop-color="#e7c98c"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.72" cy="0.34" r="0.4">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.5" stop-color="#f4cf7a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f4cf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="morro1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae5b"/><stop offset="1" stop-color="#5c9145"/>
    </linearGradient>
    <linearGradient id="morro2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8a3f"/><stop offset="1" stop-color="#356b2e"/>
    </linearGradient>
    <linearGradient id="morro3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5a2a"/><stop offset="1" stop-color="#17381f"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#ceu)"/>
  <rect width="1440" height="900" fill="url(#sol)"/>
  <circle cx="1037" cy="306" r="86" fill="#ffe6a3"/>

  <!-- Morro distante -->
  <path d="M0 470 C 240 400 430 460 640 440 C 900 415 1120 470 1440 430 L1440 900 L0 900 Z" fill="url(#morro1)"/>
  <!-- Linhas de plantio em curva de nível (agricultura de precisao) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 500 C 260 448 460 498 700 480 C 980 460 1180 505 1440 470"/>
    <path d="M0 528 C 260 478 460 526 700 508 C 980 490 1180 532 1440 500"/>
    <path d="M0 556 C 260 508 460 554 700 536 C 980 520 1180 560 1440 530"/>
  </g>

  <!-- Morro médio -->
  <path d="M0 600 C 300 540 520 600 780 578 C 1060 554 1240 610 1440 566 L1440 900 L0 900 Z" fill="url(#morro2)"/>
  <g fill="none" stroke="#0f3320" stroke-opacity="0.22" stroke-width="2.4">
    <path d="M0 640 C 300 582 520 640 780 620 C 1060 598 1240 650 1440 610"/>
    <path d="M0 676 C 300 620 520 676 780 656 C 1060 636 1240 686 1440 648"/>
    <path d="M0 712 C 300 658 520 712 780 692 C 1060 674 1240 722 1440 686"/>
    <path d="M0 748 C 300 696 520 748 780 730 C 1060 712 1240 758 1440 724"/>
  </g>

  <!-- Morro frontal -->
  <path d="M0 760 C 260 712 520 762 820 742 C 1120 722 1300 772 1440 740 L1440 900 L0 900 Z" fill="url(#morro3)"/>

  <!-- Arvore isolada -->
  <g transform="translate(196 690)">
    <rect x="-5" y="0" width="10" height="46" rx="3" fill="#3a2a1c"/>
    <circle cx="0" cy="-14" r="40" fill="#2f6a34"/>
    <circle cx="-26" cy="4" r="26" fill="#347a3a"/>
    <circle cx="26" cy="2" r="28" fill="#296030"/>
  </g>

  <!-- Drone de monitoramento -->
  <g transform="translate(1180 250)" stroke="#274a2b" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="-34" y1="-10" x2="-14" y2="0"/><line x1="34" y1="-10" x2="14" y2="0"/>
    <ellipse cx="-34" cy="-12" rx="16" ry="4" fill="#274a2b" stroke="none" opacity="0.8"/>
    <ellipse cx="34" cy="-12" rx="16" ry="4" fill="#274a2b" stroke="none" opacity="0.8"/>
    <rect x="-15" y="-2" width="30" height="14" rx="5" fill="#31593a" stroke="none"/>
    <line x1="-8" y1="12" x2="-12" y2="22"/><line x1="8" y1="12" x2="12" y2="22"/>
  </g>
</svg>
